<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diplomatura en Product Management · Apuntes</title>
  <meta name="description" content="Resúmenes, diagramas, glosario, bibliografía y fichas de repaso de la Diplomatura en Product Management (UTN-BA).">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #5b4bdb; --content-max-width: 900px; }
    .markdown-section table { display: table; width: 100%; font-size: .9em; }
    .markdown-section td, .markdown-section th { vertical-align: top; }
    .markdown-section details { border: 1px solid #e3e3ec; border-radius: 8px; padding: .6em 1em; margin: .6em 0; background: #fafaff; }
    .markdown-section details[open] { background: #fff; }
    .markdown-section summary { cursor: pointer; font-weight: 600; }
    .markdown-section .mermaid { text-align: center; margin: 1.5em 0; }
    .markdown-section blockquote { border-left-color: var(--theme-color); }
    .markdown-section .mermaid { position: relative; }
    .zoom-btn { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; border: 1px solid #d6d6e4; border-radius: 8px; background: #fff; cursor: pointer; font-size: 17px; line-height: 1; opacity: .75; }
    .zoom-btn:hover, .zoom-btn:focus { opacity: 1; border-color: var(--theme-color); }
    .zoom-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(20,20,35,.85); display: flex; flex-direction: column; }
    .zoom-bar { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 10px 14px; color: #fff; font-size: 13px; }
    .zoom-bar span { margin-right: auto; opacity: .8; }
    .zoom-bar button { min-width: 38px; height: 34px; border: 0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 16px; }
    .zoom-stage { flex: 1; overflow: hidden; cursor: grab; touch-action: none; background: #fff; margin: 0 14px 14px; border-radius: 10px; }
    .zoom-stage.dragging { cursor: grabbing; }
    .zoom-stage svg { transform-origin: 0 0; max-width: none !important; display: block; }
  </style>
</head>
<body>
  <div id="app">Cargando…</div>
  <script>
    window.$docsify = {
      name: 'Diplomatura PM',
      repo: 'micaeladesign/diplomatura-product-management',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: 'Buscar…', noData: 'Sin resultados', depth: 3 },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') { return '<div class="mermaid">' + code + '</div>'; }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              mermaid.run({ querySelector: '.mermaid' }).then(addZoomButtons).catch(addZoomButtons);
            }
          });
        }
      ]
    };
  </script>
  <script>
    // Lupa para ver los diagramas en grande, con zoom (rueda, pellizco o botones) y arrastre.
    function addZoomButtons() {
      document.querySelectorAll('.markdown-section .mermaid').forEach(function (box) {
        if (box.querySelector('.zoom-btn') || !box.querySelector('svg')) return;
        var b = document.createElement('button');
        b.className = 'zoom-btn'; b.type = 'button'; b.textContent = '🔍';
        b.title = 'Ver el diagrama en grande'; b.setAttribute('aria-label', 'Ver el diagrama en grande');
        b.addEventListener('click', function () { openZoom(box.querySelector('svg')); });
        box.appendChild(b);
      });
    }
    function openZoom(src) {
      var ov = document.createElement('div'); ov.className = 'zoom-overlay';
      ov.innerHTML = '<div class="zoom-bar"><span>Rueda o pellizco para zoom · arrastrá para moverte · Esc para cerrar</span>' +
        '<button data-a="out" aria-label="Alejar">−</button><button data-a="fit" aria-label="Ajustar">⤢</button>' +
        '<button data-a="in" aria-label="Acercar">+</button><button data-a="close" aria-label="Cerrar">✕</button></div>' +
        '<div class="zoom-stage"></div>';
      var stage = ov.querySelector('.zoom-stage');
      var svg = src.cloneNode(true);
      var vb = src.viewBox && src.viewBox.baseVal;
      var w = (vb && vb.width) || src.getBoundingClientRect().width;
      var h = (vb && vb.height) || src.getBoundingClientRect().height;
      svg.removeAttribute('style'); svg.setAttribute('width', w); svg.setAttribute('height', h);
      stage.appendChild(svg); document.body.appendChild(ov); document.body.style.overflow = 'hidden';
      var s = 1, x = 0, y = 0;
      function apply() { svg.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')'; }
      function fit() {
        var r = stage.getBoundingClientRect();
        s = Math.min(r.width / w, r.height / h) * 0.95;
        x = (r.width - w * s) / 2; y = (r.height - h * s) / 2; apply();
      }
      function zoomAt(f, cx, cy) {
        var ns = Math.min(Math.max(s * f, 0.2), 12);
        x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply();
      }
      function center(f) { var r = stage.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }
      function close() { ov.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); if (e.key === '+' || e.key === '=') center(1.25); if (e.key === '-') center(0.8); }
      document.addEventListener('keydown', onKey);
      ov.querySelector('.zoom-bar').addEventListener('click', function (e) {
        var a = e.target.getAttribute('data-a');
        if (a === 'in') center(1.25); else if (a === 'out') center(0.8); else if (a === 'fit') fit(); else if (a === 'close') close();
      });
      stage.addEventListener('wheel', function (e) {
        e.preventDefault(); var r = stage.getBoundingClientRect();
        zoomAt(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - r.left, e.clientY - r.top);
      }, { passive: false });
      var pts = {}, last = null, pinch = null;
      stage.addEventListener('pointerdown', function (e) { stage.setPointerCapture(e.pointerId); pts[e.pointerId] = e; stage.classList.add('dragging'); });
      stage.addEventListener('pointermove', function (e) {
        if (!pts[e.pointerId]) return;
        var prev = pts[e.pointerId]; pts[e.pointerId] = e;
        var ids = Object.keys(pts);
        if (ids.length === 2) {
          var a = pts[ids[0]], b = pts[ids[1]], r = stage.getBoundingClientRect();
          var d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          if (pinch) zoomAt(d / pinch, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top);
          pinch = d;
        } else { x += e.clientX - prev.clientX; y += e.clientY - prev.clientY; apply(); }
      });
      function up(e) { delete pts[e.pointerId]; pinch = null; if (!Object.keys(pts).length) stage.classList.remove('dragging'); }
      stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
      fit();
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'neutral' });</script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
